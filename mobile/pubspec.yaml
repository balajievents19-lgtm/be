name: balaji_royal_events
description: Official Balaji Royal Events mobile app — the native experience of www.balajiroyalevents.com.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  cached_network_image: ^3.4.1
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1
  webview_flutter: ^4.10.0
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  intl: ^0.20.3
  share_plus: ^10.1.4
  permission_handler: ^11.4.0
  geolocator: ^13.0.2
  flutter_contacts: ^1.1.9+2
  app_links: ^6.4.0
  path_provider: ^2.1.5
  open_filex: ^4.6.0
  webview_cookie_manager_plus: ^2.0.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/brand/logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/logo.png
  adaptive_icon_background: "#FFF8F0"
  adaptive_icon_foreground: assets/brand/logo.png
  adaptive_icon_foreground_inset: 18
  remove_alpha_ios: true
