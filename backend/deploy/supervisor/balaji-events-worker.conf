; Balaji Events — Laravel queue worker (Supervisor)
; Install: sudo cp deploy/supervisor/balaji-events-worker.conf /etc/supervisor/conf.d/
;          sudo supervisorctl reread && sudo supervisorctl update
;          sudo supervisorctl start balaji-events-worker:*

[program:balaji-events-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/balaji-events/backend/artisan queue:work database --sleep=3 --tries=3 --max-time=3600 --timeout=90
directory=/var/www/balaji-events/backend
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/balaji-events/backend/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stopwaitsecs=3600
