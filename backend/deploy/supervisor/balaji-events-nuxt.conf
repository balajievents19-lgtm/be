; Balaji Events — Nuxt SSR process (Supervisor)
; Optional companion to Laravel worker
; sudo cp deploy/supervisor/balaji-events-nuxt.conf /etc/supervisor/conf.d/
; Ensure log directory exists: sudo mkdir -p /var/log/balaji-events && sudo chown www-data:www-data /var/log/balaji-events

[program:balaji-events-nuxt]
command=node /var/www/balaji-events/frontend/.output/server/index.mjs
directory=/var/www/balaji-events/frontend
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/balaji-events/nuxt.log
stdout_logfile_maxbytes=10MB
environment=HOST="127.0.0.1",PORT="3000",NITRO_HOST="127.0.0.1",NITRO_PORT="3000",NODE_ENV="production"
