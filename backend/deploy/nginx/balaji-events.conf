# Balaji Royal Events — Nginx (Ubuntu 24.04)
# Place under /etc/nginx/sites-available/balaji-events
# Symlink: ln -s /etc/nginx/sites-available/balaji-events /etc/nginx/sites-enabled/
#
# Public origin (same host):
#   https://www.balajiroyalevents.com       → Nuxt SSR
#   https://www.balajiroyalevents.com/api   → Laravel
#   https://www.balajiroyalevents.com/admin → Filament
#   /sitemap.xml and /robots.txt           → Laravel
#
# SSL paths after certbot.

upstream balaji_nuxt {
    server 127.0.0.1:3000;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.balajiroyalevents.com balajiroyalevents.com;

    # Redirect HTTP → HTTPS (enable after certbot)
    # return 301 https://$host$request_uri;

    root /var/www/balaji-events/backend/public;
    index index.php;
    client_max_body_size 20M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /up {
        try_files $uri /index.php?$query_string;
    }

    location = /sitemap.xml {
        try_files $uri /index.php?$query_string;
    }

    location = /robots.txt {
        try_files $uri /index.php?$query_string;
    }

    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /admin {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /livewire {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Original CMS files are gated by Laravel (admin session only).
    location /storage/ {
        rewrite ^ /index.php last;
    }

    # Public display images (resized + watermarked). Do not collide with /media (Nuxt).
    location /protected-media/ {
        rewrite ^ /index.php last;
    }

    # Filament published CSS/JS/fonts must not fall through to the Nuxt location.
    location /css/filament/ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    location /js/filament/ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    location /fonts/filament/ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120s;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://balaji_nuxt;
        proxy_read_timeout 60s;
    }
}
