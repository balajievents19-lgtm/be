# Balaji Events — Nginx (Ubuntu 24.04)
# Place under /etc/nginx/sites-available/balaji-events
# Symlink: ln -s /etc/nginx/sites-available/balaji-events /etc/nginx/sites-enabled/
#
# Replace:
#   api.example.com  → Laravel API + Filament + sitemap/robots
#   www.example.com  → Nuxt SSR
#   /var/www/balaji-events/backend
#   SSL paths after certbot

upstream balaji_nuxt {
    server 127.0.0.1:3000;
    keepalive 8;
}

# -----------------------------------------------------------------------------
# Laravel API + Admin (Filament) + sitemap/robots
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # Redirect HTTP → HTTPS (enable after certbot)
    # return 301 https://$host$request_uri;

    root /var/www/balaji-events/backend/public;
    index index.php;

    client_max_body_size 20M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120s;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|webp|svg|woff2?)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

