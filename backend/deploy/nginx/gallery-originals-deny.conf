# Production note: protect legacy public originals directory
#
# After `php artisan gallery:secure-originals`, originals are removed from
# `storage/app/public/gallery/images`. Thumbnails remain under
# `storage/app/public/gallery/thumbnails` (and any `gallery/previews`).
#
# If any legacy files remain under `public/storage/gallery/images`, deny
# direct web access at the web server:
#
# Nginx:
#   location ^~ /storage/gallery/images/ { deny all; return 404; }
#
# Apache (public/storage/gallery/images/.htaccess):
#   Require all denied
